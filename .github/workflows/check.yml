name: Check Lua

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck
      - name: Check syntax and globals
        run: |
          luac5.1 -p ForeverTracking.lua
          luacheck ForeverTracking.lua
